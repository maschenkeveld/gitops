apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: konnect-details-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: konnect-details-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        values.yaml: |
          kuma:
            controlPlane:
              konnect:
                cpId: "{{ .cpId }}"
  dataFrom:
    - extract:
        key: konnect/konnect-${mink_control_plane_region}-${mink_control_plane_name}/connection-details