apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-mesh-control-plane-api-to-https-ingress
  namespace: kong-mesh-system
  labels:
    app: kong-mesh-control-plane-api-to-https-ingress
    app.kubernetes.io/instance: kong-mesh
    app.kubernetes.io/name: kong-mesh
  annotations:
    # NGINX related annotations: (Tested)
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-ssl-secret: kong-mesh-system/kong-mesh-tls-general-ca-certs
    nginx.ingress.kubernetes.io/proxy-ssl-verify: 'on'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_ssl_name "kong-mesh-control-plane.kong-mesh-system.svc";
    # Azure App Gateway related annotations:
    # kubernetes.io/ingress.class: azure/application-gateway
    # appgw.ingress.kubernetes.io/backend-protocol: "https"
    # appgw.ingress.kubernetes.io/appgw-trusted-root-certificate: "name-of-my-root-cert1"
spec:
  ingressClassName: nginx
  rules:
    - host: api-to-https-ingress.mesh-global.k8s.mschnkvld.lab
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: kong-mesh-control-plane
                port:
                  number: 5682
