apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kong-clustering-int-ca
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  refreshInterval: "1h"
  target:
    name: kong-clustering-int-ca
    creationPolicy: 'Owner'
    deletionPolicy: "Retain"
  data:
    - secretKey: tls.crt
      remoteRef:
        key: kong-clustering-pki
        property: int_ca_cert_chain_pem
        decodingStrategy: None
    - secretKey: tls.key
      remoteRef:
        key: kong-clustering-pki
        property: int_ca_key_pem
        decodingStrategy: None