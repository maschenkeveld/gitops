apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 1m
  releaseName: external-dns
  chart:
    spec:
      chart: external-dns
      version: 1.19.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
  values:
    resources:
      requests:
        cpu: 25m
        memory: 75Mi
      limits:
        memory: 150Mi
    # provider: cloudflare
    # cloudflare:
    #   apiToken: 5pSjR1q-LK2rN5rOIaP8IDb7IDIEhXw1GDgagkcv
    #   email: you@example.com
    #   proxied: false
    # txtOwnerId: "${k8s_cluster_name}"
    # crd:
    #   create: true
    # sources:
    #   - crd
    #   - service
    #   - ingress

    provider:
      name: cloudflare

    # Cloudflare configuration
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token

    sources:
      - service
      - ingress
      - gateway-httproute

    # Optionally limit ExternalDNS to specific domains
    domainFilters:
      - example.com

    # TXT registry owner ID (helps ExternalDNS identify its own records)
    txtOwnerId: "${k8s_cluster_name}"

    # Policy for record updates (usually `upsert-only`)
    policy: upsert-only
