apiVersion: kuma.io/v1alpha1
kind: MeshHTTPRoute
metadata:
  name: header-version-to-path
  namespace: ${namespace}
  labels:
    kuma.io/mesh: ${mesh}
    kuma.io/origin: zone
spec:
  targetRef:
    kind: Dataplane
    labels:
      app: ${name}
  to:
    - targetRef:
        kind: MeshService
        name: rupert
        namespace: rupert
      rules:
        - matches:
            - headers:
                - name: "version"
                  value: "v1"
                  type: Exact
              path:
                type: Exact
                value: "/crawl"
          default:
            filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: "/crawl/v1"
        - matches:
            - headers:
                - name: "version"
                  value: "v2"
                  type: Exact
              path:
                type: Exact
                value: "/crawl"
          default:
            filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: "/crawl/v2"
---
