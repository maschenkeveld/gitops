apiVersion: kuma.io/v1alpha1
kind: MeshCircuitBreaker
metadata:
  name: circuit-breaker-alice-to-charlie
  namespace: ${namespace}
  labels:
    kuma.io/mesh: ${mesh}
    kuma.io/origin: zone
spec:
  targetRef:
    kind: Dataplane
    labels:
      app: ${name}
  to:
  - targetRef:
      kind: MeshService
      name: charlie
      namespace: charlie
    default:
      connectionLimits:
        maxConnections: 2
        maxPendingRequests: 8
        maxRetries: 2
        maxRequests: 2
