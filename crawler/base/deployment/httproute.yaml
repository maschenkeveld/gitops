apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "${name}"
  namespace: "${namespace}"
  labels:
    app: ${name}
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - "${name}.${k8s_cluster_name}.${host_machine}.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ${name}
          port: 8080
