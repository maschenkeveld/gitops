---
apiVersion: v1
kind: Service
metadata:
  name: "${name}"
  namespace: "${namespace}"
  labels:
    app: "${name}"
    version: "${version}"
spec:
  selector:
    app: "${name}"
    version: "${version}"
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      appProtocol: http
      name: application
    # - protocol: TCP
    #   port: 5670
    #   targetPort: 5670
    #   appProtocol: http
    #   name: metrics
  type: ClusterIP