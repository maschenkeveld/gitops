apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: konnect-api-token
  # Must live in flux-system (not kong-operator): Flux's postBuild.substituteFrom
  # only looks for the referenced Secret in the same namespace as the
  # Kustomization object itself (confirmed via the Kustomization CRD schema),
  # and that's how konnect-api-auth-configuration.yaml's ${token} gets resolved
  # - see the comment there for why secretRef-based auth isn't used instead.
  namespace: flux-system
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: konnect-api-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: konnect/kpat
        property: token
