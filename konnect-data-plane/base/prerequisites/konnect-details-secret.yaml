apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: konnect-details-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: konnect-details-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        values.yaml: |
          env:
            cluster_control_plane: "{{ .control_plane_endpoint }}"
            cluster_server_name: "{{ .control_plane }}"
            cluster_telemetry_endpoint: "{{ .telemetry_endpoint }}"
            cluster_telemetry_server_name: "{{ .telemetry }}"
  dataFrom:
    - extract:
        key: konnect/${kong_deployment_name}/connection-details