---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kong-enterprise-license
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  refreshInterval: "1h"
  target:
    name: kong-enterprise-license
    creationPolicy: 'Owner'
    deletionPolicy: "Retain"
  data:
    - secretKey: license
      remoteRef:
        key: kong-license
        property: license
        decodingStrategy: None

