apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kong-proxy-default-tls
spec:
  secretName: kong-proxy-default-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.${host_machine}.example.com"
    - "*.${k8s_cluster_name}.${host_machine}.example.com"
