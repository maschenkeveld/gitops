apiVersion: v1
kind: ConfigMap
metadata:
  name: example-policy
data:
  example.rego: |
    package example

    greeting := msg if {
        info := opa.runtime()
        hostname := info.env["HOSTNAME"]
        hostname != null  # This is the condition
        msg := sprintf("hello from pod %q!", [hostname])
    }
  authorize_request.rego: |
    package authorize_request

    import rego.v1

    default allow := false

    default headers := []

    allow if {
      input.request.http.headers["operation-id"] == "yyyy-yyyy-yyyy-yyyy"
    }

    headers := headers if {
      input.request.http.headers["operation-id"] == "yyyy-yyyy-yyyy-yyyy"
      headers := {"header-from-opa": "You are a good boy!"}
    }
