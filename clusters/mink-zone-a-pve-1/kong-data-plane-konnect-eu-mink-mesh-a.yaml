---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kong-dp-konnect-eu-mink-mesh-a-prerequisites
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./konnect-data-plane/meshes/kong-mesh/prerequisites
  prune: true
  wait: true
  timeout: 1m
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: kong-dp-konnect-eu-mink-mesh-a
  dependsOn:
    - name: external-secrets-configs
      namespace: flux-system
    - name: cert-manager-configs
      namespace: flux-system
  postBuild:
    substitute:
      host_machine: "pve-1"
      k8s_cluster_name: "mink-zone-a"
      kong_deployment_name: "konnect-eu-mink-mesh-a"
      cp_dp_name: "dp"
      mesh: "mesh-a"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kong-dp-konnect-eu-mink-mesh-a-deployment
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./konnect-data-plane/base/deployment
  prune: true
  wait: true
  timeout: 1m
  dependsOn:
    - name: kong-dp-konnect-eu-mink-mesh-a-prerequisites
      namespace: flux-system
  postBuild:
    substitute:
      host_machine: "pve-1"
      k8s_cluster_name: "mink-zone-a"
      kong_deployment_name: "konnect-eu-mink-mesh-a"
      cp_dp_name: "dp"
      kong_gateway_image: kong/kong-gateway
      kong_gateway_image_version: "3.10.0.4-debian"
      mesh: "mesh-a"
      plugins: bundled
