apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1m
  releaseName: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: 0.9.10
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  values:
    installCRDs: true
    resources:
      requests:
        cpu: 25m
        memory: 50Mi
      limits:
        memory: 150Mi
    webhook:
      resources:
        requests:
          cpu: 25m
          memory: 50Mi
        limits:
          memory: 150Mi
    certController:
      resources:
        requests:
          cpu: 25m
          memory: 75Mi
        limits:
          memory: 150Mi