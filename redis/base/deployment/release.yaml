apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: redis
spec:
  interval: 1m
  releaseName: redis
  chart:
    spec:
      chart: redis
      version: 18.17.1
      sourceRef:
        kind: HelmRepository
        name: bitnami
  values:
    architecture: standalone

    auth:
      enabled: true
      sentinel: false
      password: "haqxDpyly6iSmLrgNpDt"

    replica:
      replicaCount: 3
    
    master:
      service:
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: "redis.${k8s_cluster_name}.${host_machine}.example.com"
